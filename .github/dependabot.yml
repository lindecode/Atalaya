version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
